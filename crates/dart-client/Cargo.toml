[package]
name = "dart-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
dart-protocol = { path = "../dart-protocol" }
futures-util = "0.3"
http = "1.2"
http-body-util = "0.1"
hyper = { version = "1.11", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = "0.29.0"

[dev-dependencies]
dart-daemon = { path = "../dart-daemon" }
dart-server = { path = "../dart-server" }

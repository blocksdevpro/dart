[package]
name = "dart"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time"] }
toml = "1.1.4"
